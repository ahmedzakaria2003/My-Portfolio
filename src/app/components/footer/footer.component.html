<footer class="bg-gray-800 border-t border-gray-700 relative">
  <div class="container mx-auto px-6 py-8">
    <div class="flex flex-col md:flex-row justify-between items-center">
      <div class="text-center md:text-left mb-4 md:mb-0">
        <p class="text-gray-300 flex items-center justify-center md:justify-start">
          Made with <lucide-icon name="heart" [size]="16" class="text-red-400 mx-1"></lucide-icon> by Ahmed Zakaria
        </p>
        <p class="text-gray-500 text-sm mt-1">
          © {{ currentYear }} All rights reserved.
        </p>
      </div>

      <div class="flex items-center space-x-4">
        <a
          href="https://github.com/ahmedzakaria2003"
          target="_blank"
          rel="noopener noreferrer"
          class="text-gray-400 hover:text-white transition-colors duration-200"
        >
          <lucide-icon name="github" [size]="20"></lucide-icon>
        </a>
        <a
          href="https://linkedin.com/in/ahmed-zakaria-454aa8319"
          target="_blank"
          rel="noopener noreferrer"
          class="text-gray-400 hover:text-white transition-colors duration-200"
        >
          <lucide-icon name="linkedin" [size]="20"></lucide-icon>
        </a>
        <a
          href="mailto:ahmedmohamedzakaria423@gmail.com"
          class="text-gray-400 hover:text-white transition-colors duration-200"
        >
          <lucide-icon name="mail" [size]="20"></lucide-icon>
        </a>
      </div>
    </div>
  </div>

  <!-- Floating Scroll To Top Button -->
  <button
    *ngIf="showScrollTop"
    (click)="scrollToTop()"
    class="fixed bottom-8 right-8 z-50 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white p-3.5 rounded-full shadow-2xl transition-all duration-300 transform hover:scale-110 flex items-center justify-center cursor-pointer border border-blue-400/40 group animate-bounce-subtle"
    aria-label="Scroll to top"
    title="Scroll to Top"
  >
    <lucide-icon name="arrow-up" [size]="24" class="group-hover:-translate-y-1 transition-transform duration-200"></lucide-icon>
  </button>
</footer>
